# Copy to ~/.config/cc-remote/tui.toml, or pass --config PATH.
# Arrays replace defaults; [] unbinds. Relaunch only the TUI after editing.
# [keys] applies globally, including Insert; prefer Ctrl combinations.
[vim]
yank_highlight_ms = 200 # 0 disables the flash; maximum 5000 ms.

[keys]
paste_image = ["ctrl+v"] # Main draft: desktop clipboard image; forms: text
toggle_pane = [] # Use Ctrl+j / Ctrl+k; Tab is jump-forward in the reader.
focus_draft = ["ctrl+j"] # Draft, or next picker result
focus_read = ["ctrl+k"]  # Read, or previous picker result
send = [] # Optional global alias; [draft].send controls Normal submission.
queue = ["ctrl+e"]
stop = ["ctrl+x"] # Main chat/draft: interrupt current turn, keep queued items.
sessions = [] # Optional global alias for the tree; Ctrl+p is unbound.
answer = ["ctrl+t"]
complete = ["ctrl+space", "ctrl+@"]
quit = ["ctrl+q"]

# Sequences in main-pane Normal/Visual mode; never consume inserted text.
[normal]
jump_back = ["ctrl+o"]
jump_forward = ["ctrl+i", "tab"]
preview = ["space v"]
diagram_browser = ["space B"] # Open the current session in authenticated Web.
help = ["space h"]
goal = ["space g"]
usage = ["space u"]
queue_details = ["space l"]
actions = ["space a"]
settings = ["space s"]
reports = ["space r"]
background = ["space b b"]
buffer_previous = ["H"]
buffer_next = ["L"]
buffer_search = ["space comma"]
buffer_close = ["space b d"]
status = ["space t"]
notices = ["space n"]
tree = ["space e"]
engine = ["space c"]
space = ["space w"]
quote = ["space q"]
new_session = ["space enter"]
model = ["space m"]
permissions = ["space p"]
previous_user = ["left_square_bracket u"]
next_user = ["right_square_bracket u"]
previous_assistant = ["left_square_bracket a"]
next_assistant = ["right_square_bracket a"]
previous_message = ["left_square_bracket m"]
next_message = ["right_square_bracket m"]

# Local, single-key bindings. Insert mode suspends printable actions.
[draft]
send = ["enter"]
cancel = ["escape"] # Command-editor cancellation; Vim Esc still exits Insert.

[reader]
latest_user = ["g u"]
latest_assistant = ["g a"]
first = ["g g"]
follow = ["G"]
details = ["enter"]
older = ["o"]
newer = ["O"]
close = ["escape"]
command = ["colon"]

[tree_search]
down = ["down"]
up = ["up"]
choose = ["enter"]
close = ["escape"]

[tree]
down = ["j", "down"]
up = ["k", "up"]
first = ["g g"] # Tree also accepts multi-key chords and Vim counts.
last = ["G"]
fold = ["h", "left"]
expand = ["l", "right"]
fold_all = ["H"]
expand_all = ["L"]
rename = ["r"]
delete = ["d"]
delete_direct = ["D"] # Permanent deletion, without a local confirmation.
search = ["slash"]
close = ["escape"]
choose = ["enter"]

[panel]
close = ["escape"]
refresh = ["r"]
actions = ["a"]
edit = ["i"]
hide = ["x"]
search = ["slash"] # Help: search the shortcut index, never execute results.
next_field = ["tab"]
previous_field = ["shift+tab"]

[picker]
first = ["home"]
last = ["end"]
page_up = ["pageup"]
page_down = ["pagedown"]
close = ["escape"]
search = ["slash"]
edit = ["i"]
down = ["j", "down"]
up = ["k", "up"]
parent = ["h", "ctrl+left"] # Directory picker only
open = ["l", "ctrl+right"]  # Directory picker only
refresh = ["r", "ctrl+r"]  # Directory picker only
choose = ["enter"]
next_field = ["tab"]
previous_field = ["shift+tab"]

[form]
advanced = ["ctrl+r"]
close = ["escape"]
help = ["question_mark"]
confirm = ["enter"]
next_field = ["tab"]
previous_field = ["shift+tab"]

[file_hints]
first = ["home"]
last = ["end"]
page_up = ["pageup"]
page_down = ["pagedown"]
close = ["escape"]
down = ["j", "down"]
up = ["k", "up"]
parent = ["h"] # Previous page (digits 1-9 open a file)
open = ["l"]   # Next page
choose = ["enter"]
select_1 = ["1"]
select_2 = ["2"]
select_3 = ["3"]
select_4 = ["4"]
select_5 = ["5"]
select_6 = ["6"]
select_7 = ["7"]
select_8 = ["8"]
select_9 = ["9"]
next_field = ["tab"]
previous_field = ["shift+tab"]

[preview]
browser = ["alt+b"]
close = ["escape"]
refresh = ["r"]
authorize = ["a"] # Only when an exact-file authorization is required
next_field = ["tab"]
previous_field = ["shift+tab"]

[image]
browser = ["alt+b"]
close = ["escape"]
refresh = ["r"]
authorize = ["a"]
left = ["h", "left"]
right = ["l", "right"]
down = ["j", "down"]
up = ["k", "up"]
zoom_in = ["z i"]
zoom_out = ["z o"]
fit = ["z f"]
next_field = ["tab"]
previous_field = ["shift+tab"]

[confirmation]
yes = ["y"]
close = ["n", "escape"]
choose = ["enter"]
down = ["j", "down"]
up = ["k", "up"]
next_field = ["tab"]
previous_field = ["shift+tab"]

[queue]
close = ["escape"]
down = ["j", "down"]
up = ["k", "up"]
choose = ["enter"]
edit = ["i"]
delete = ["d"]
move_up = ["K"]
move_down = ["J"]
first = ["home"]
last = ["end"]
page_up = ["pageup"]
page_down = ["pagedown"]
next_field = ["tab"]
previous_field = ["shift+tab"]

[question]
close = ["escape"]
confirm = ["enter"]
edit = ["i"]
down = ["j", "down"]
up = ["k", "up"]
next = ["ctrl+right"]
previous = ["ctrl+left"]
next_field = ["tab"]
previous_field = ["shift+tab"]
